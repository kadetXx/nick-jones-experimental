<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

    <title>Fibonacci Spiral</title>
    <meta name="description" content="An endless nest of golden rectangles. Every scroll step is a quarter turn and a phi scale-up, so the spiral falls back into itself forever." />
    <meta name="theme-color" content="#241539" />
    <link rel="canonical" href="https://kadetxx.github.io/nick-jones-experimental/" />

    <!-- Crawlers never run the page, and the art is drawn at runtime, so the
         card image is a still of the real thing rather than anything separate.
         Absolute URLs: Twitter and Facebook do not resolve relative ones.
         One tag per line: the spec allows wrapping, but the long tail of
         scrapers matches a line at a time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fibonacci Spiral" />
    <meta property="og:url" content="https://kadetxx.github.io/nick-jones-experimental/" />
    <meta property="og:title" content="Fibonacci Spiral" />
    <meta property="og:description" content="An endless nest of golden rectangles. Every scroll step is a quarter turn and a phi scale-up, so the spiral falls back into itself forever." />
    <meta property="og:image" content="https://kadetxx.github.io/nick-jones-experimental/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Golden rectangles subdividing into the corner, each square holding a different drawing, in teal and cream." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fibonacci Spiral" />
    <meta name="twitter:description" content="An endless nest of golden rectangles. Every scroll step is a quarter turn and a phi scale-up, so the spiral falls back into itself forever." />
    <meta name="twitter:image" content="https://kadetxx.github.io/nick-jones-experimental/og.png" />
    <meta name="twitter:image:alt" content="Golden rectangles subdividing into the corner, each square holding a different drawing, in teal and cream." />

    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="stage">
      <div id="clip">
        <div id="spiral"></div>
      </div>

      <!-- Inside #stage so it inherits the theme variables the loop sets. -->
      <button id="sound" type="button" aria-pressed="false" aria-label="Turn sound on"></button>
    </div>

    <audio id="track" src="theme.mp3" loop preload="auto"></audio>
  </body>
</html>
